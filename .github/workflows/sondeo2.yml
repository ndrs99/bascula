name: Sondeo de tiendas
on:
  push:
    paths: ['tools/sondeo2.py', '.github/workflows/sondeo2.yml']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/sondeo2.py
      - run: |
          git config user.name "precios-bot"; git config user.email "precios-bot@users.noreply.github.com"
          git checkout -b sondeo-tiendas && git add -f sondeo && git commit -m "Sondeo de tiendas" && git push -f origin sondeo-tiendas
