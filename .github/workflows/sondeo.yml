name: Sondeo de precios
on:
  workflow_dispatch:
  push:
    paths: ['tools/sondeo.py', '.github/workflows/sondeo.yml']
permissions:
  contents: write
jobs:
  sondeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/sondeo.py
      - run: |
          git config user.name "precios-bot"; git config user.email "precios-bot@users.noreply.github.com"
          git checkout -b sondeo-precios
          git add -f sondeo && git commit -m "Sondeo de precios" && git push -f origin sondeo-precios
