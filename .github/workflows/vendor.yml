name: Copiar librerías del escáner
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/vendor.yml']
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p vendor tmpv && cd tmpv
          npm pack zxing-wasm@2 @zxing/library@0.21.3 >/dev/null
          for f in *.tgz; do mkdir -p "${f%.tgz}"; tar xzf "$f" -C "${f%.tgz}"; done
          find . -path '*dist*' -name '*.js' -path '*reader*' | head -50 > ../vendor/listado.txt
          find . -name '*.wasm' >> ../vendor/listado.txt
          cat */package/package.json | grep '"version"' >> ../vendor/listado.txt
          ZW=$(ls -d zxing-wasm-*/package)
          cp $ZW/dist/iife/reader/index.js ../vendor/zxing-reader.js || true
          cp $(find $ZW -name 'zxing_reader.wasm' | head -1) ../vendor/zxing_reader.wasm || true
          cp zxing-library-*/package/umd/index.min.js ../vendor/zxing-library.min.js || true
          cp $ZW/LICENSE ../vendor/LICENSE-zxing-wasm 2>/dev/null || true
          cd .. && rm -rf tmpv && ls -la vendor
      - run: |
          git config user.name "precios-bot"; git config user.email "precios-bot@users.noreply.github.com"
          git add vendor && (git diff --cached --quiet || (git commit -m "Librerías del escáner copiadas al repositorio" && git pull --rebase && git push))
