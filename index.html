<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10b981">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Báscula</title>
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#0d1b16;--mute:#6b7a74;--line:#e6ebe8;--soft:#eef3f0;--acc:#12b886;--acc-d:#0c8f68;--grad:linear-gradient(135deg,#12b886 0%,#0ca5a0 55%,#0b8ea8 100%);--acc2:#3b9eff;--warn:#f59f00;--bad:#f03e3e;--p:#7950f2;--c:#f59f00;--f:#e64980;--sh:0 1px 2px rgba(16,24,20,.04),0 10px 30px rgba(16,24,20,.07);--bd:transparent}
@media (prefers-color-scheme:dark){:root{--bg:#090e0c;--card:#121916;--ink:#e8efec;--mute:#8a9892;--line:#222c28;--soft:#1a2420;--sh:0 10px 30px rgba(0,0,0,.35);--bd:#1f2925}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;font-size:15px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 75%,transparent);padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;display:flex;align-items:center;gap:8px;max-width:640px;margin:0 auto}
header .ttl{flex:1;min-width:0}
header h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-.03em;line-height:1.05}
header .sub{font-size:13px;color:var(--mute);margin-top:2px;font-weight:500}
main{padding:0 16px calc(120px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--line);border-radius:24px;padding:6px;z-index:6;box-shadow:var(--sh);max-width:560px;margin:0 auto}
nav.tabs button{flex:1;min-width:0;border:0;background:none;color:var(--mute);padding:7px 0 5px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:18px;transition:all .2s}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--acc);background:var(--soft)}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0;box-shadow:var(--sh);border:1px solid var(--bd)}
.hero{background:var(--grad);color:#fff;border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .mute{color:rgba(255,255,255,.8)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.mute{color:var(--mute)} .sm{font-size:13px}
.h{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:16px 0 4px;font-weight:700}
.btn{border:0;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:650;background:var(--soft);color:var(--ink);cursor:pointer;transition:transform .1s,opacity .2s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4}
.btn.pri{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(18,184,134,.3)}
.btn.ghost{background:none;color:var(--acc);padding:8px 6px}
.btn.bad{background:none;color:var(--bad)}
.btn.block{width:100%;display:block}
.btn.small{padding:8px 12px;font-size:13px;border-radius:12px}
.btn.round{width:40px;height:40px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:20px;background:var(--card);box-shadow:var(--sh)}
.pill{border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;background:var(--card);color:var(--ink);box-shadow:var(--sh);white-space:nowrap;font-variant-numeric:tabular-nums;font-family:inherit}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--mute);margin-right:7px;vertical-align:middle}
.dot.on{background:var(--acc);box-shadow:0 0 0 4px rgba(18,184,134,.2)}
.dot.wait{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
input,select,textarea{font:inherit;color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);background:var(--card)}
label{display:block;font-size:12.5px;color:var(--mute);margin-top:10px;font-weight:600}
label input,label select{margin-top:5px}
.chk{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:14px;margin:0;font-weight:500}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--acc)}
.sheet-bg{position:fixed;inset:0;background:rgba(5,12,9,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:10;opacity:0;pointer-events:none;transition:opacity .22s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;z-index:11;padding:26px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1);max-width:640px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet::before{content:"";position:absolute;top:9px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:var(--line)}
.sheet.on{transform:none}
.big{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.04em;line-height:1}
.big small{font-size:22px;letter-spacing:0;color:var(--mute);font-weight:600}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;transition:width .5s ease}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .nm{font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .btn{padding:12px 4px;white-space:nowrap}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.nut{background:var(--soft);border-radius:14px;padding:10px 4px;text-align:center}
.nut b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.nut span{font-size:11px;color:var(--mute);font-weight:600}
.tag{font-size:10.5px;padding:3px 7px;border-radius:7px;background:var(--soft);color:var(--mute);font-weight:700;letter-spacing:.02em}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;z-index:30;opacity:0;transition:all .25s;pointer-events:none;font-size:14px;font-weight:600;box-shadow:var(--sh)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;padding:8px 12px;border-radius:10px;color:var(--mute);font-weight:700;font-family:inherit}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
video{width:100%;border-radius:18px;background:#000;max-height:50vh;object-fit:cover}
.scanbox{position:relative;aspect-ratio:3/4;max-height:56vh;width:100%;border-radius:24px;overflow:hidden;background:#000}
.scanbox video{position:absolute;inset:0;width:100%;height:100%;max-height:none;border-radius:0;object-fit:cover}
.scanwin{position:absolute;left:9%;right:9%;top:31%;height:30%;border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.5)}
.scanwin i{position:absolute;width:28px;height:28px;border:4px solid #fff;border-radius:4px}
.scanwin .c1{top:-2px;left:-2px;border-right:0;border-bottom:0;border-top-left-radius:18px}.scanwin .c2{top:-2px;right:-2px;border-left:0;border-bottom:0;border-top-right-radius:18px}
.scanwin .c3{bottom:-2px;left:-2px;border-right:0;border-top:0;border-bottom-left-radius:18px}.scanwin .c4{bottom:-2px;right:-2px;border-left:0;border-top:0;border-bottom-right-radius:18px}
.sline{position:absolute;left:8%;right:8%;height:2px;background:#12b886;box-shadow:0 0 12px 2px rgba(18,184,134,.8);animation:scanl 2s ease-in-out infinite}
@keyframes scanl{0%,100%{top:12%}50%{top:86%}}
.scanst{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.qwrap{flex-wrap:wrap;overflow:visible;margin:6px 0 0;padding:0}
label.chip,label.btn{display:inline-flex;align-items:center;justify-content:center;margin:0;color:var(--ink);font-size:inherit}
.hcard{margin-top:14px;border-radius:20px;padding:14px;background:color-mix(in srgb,var(--hc) 11%,transparent);border:1.5px solid color-mix(in srgb,var(--hc) 35%,transparent)}
.hchip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--card);color:var(--ink)}
.hchip.bad{color:var(--bad)}.hchip.good{color:var(--acc-d)}
@media (prefers-color-scheme:dark){.hchip.good{color:var(--acc)}}
.altit{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.altload{text-align:center;color:var(--mute);padding:40px 10px;line-height:1.5}
.scanst.busy{background:rgba(18,184,134,.85)}.scanst.err{background:rgba(240,62,62,.88);white-space:normal;text-align:center;border-radius:16px;width:86%;line-height:1.35}
.qhead{display:flex;gap:14px;align-items:flex-start}
.qimg{width:72px;height:72px;border-radius:18px;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.qimg img{width:100%;height:100%;object-fit:contain}.qimg span{font-size:34px}
.qname{font-size:19px;font-weight:800;line-height:1.2;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nsb{color:#fff;border-radius:7px;padding:3px 8px;font-size:11px;font-weight:800;letter-spacing:.02em}
.qfav{color:var(--warn)}
.qweigh{background:var(--soft);border-radius:24px;padding:18px 14px 14px;margin-top:16px}
.qnum{display:flex;align-items:center;gap:10px}
.qstep{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:24px;font-weight:600;box-shadow:var(--sh);font-family:inherit}
.qin{flex:1;display:flex;align-items:baseline;justify-content:center;gap:4px}
.qin input{border:0;background:none;padding:0;width:100%;max-width:190px;text-align:center;font-size:58px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.05}
.qin input:focus{background:none;border:0}.qin span{font-size:22px;font-weight:700;color:var(--mute)}
.qpill{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;font-family:inherit;display:inline-flex;align-items:center}
.qpill.on{border-color:var(--acc);color:var(--acc)}
.qquick{display:flex;gap:6px;margin-top:12px}
.qquick button{flex:1;border:0;background:var(--card);color:var(--ink);border-radius:12px;padding:9px 0;font-weight:700;font-size:13px;font-family:inherit}
.qnut{background:var(--soft);border-radius:24px;padding:16px;margin-top:10px}
.qkcal{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--acc);font-variant-numeric:tabular-nums}
.qmac{display:flex;gap:16px;text-align:center}.qmac b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.qmac span{font-size:11px;color:var(--mute);font-weight:600}
.qbar{display:flex;height:8px;border-radius:5px;overflow:hidden;margin-top:14px;gap:2px;background:var(--line)}.qbar i{display:block;height:100%}
.qfoot{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;background:var(--card);margin:18px -18px calc(-24px - env(safe-area-inset-bottom));padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.warnbox{background:rgba(245,159,0,.12);color:var(--ink);border-radius:16px;padding:14px;font-size:14px;margin:12px 0}
.mealic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.kc{font-weight:800;font-variant-numeric:tabular-nums}
.mini{text-align:center;flex:1}
.mini b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.mini span{font-size:11.5px;color:var(--mute);font-weight:600}
.addbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:1.5px dashed var(--line);background:none;color:var(--acc);border-radius:14px;padding:10px;font-weight:700;font-size:14px;margin-top:10px;font-family:inherit}
.gauge{position:relative;width:250px;height:250px;margin:6px auto 4px}
.gauge svg{position:absolute;inset:0}
.gauge .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.spin{transform-origin:125px 125px;animation:rot 1.4s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 4px;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:650;font-size:13.5px;font-family:inherit}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.help{border-bottom:1px solid var(--line)}
details.help summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer}
details.help summary::-webkit-details-marker{display:none}
details.help .chev{transition:transform .2s;font-size:20px}
details.help[open] .chev{transform:rotate(90deg)}
.helpb{font-size:14px;line-height:1.55;padding:0 0 12px 48px}
.helpb ul,.helpb ol{padding-left:18px;margin:6px 0}.helpb li{margin:5px 0}.helpb p{margin:6px 0}
.stat{display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;background:var(--soft);font-size:12.5px;font-weight:700;color:var(--mute)}
</style>
</head>
<body>
<header><button class="btn round" id="back" onclick="go('hoy')" style="display:none;flex:none">‹</button><div class="ttl"><h1 id="title">Hoy</h1><div class="sub" id="sub"></div></div><button class="pill" id="pill" onclick="pillTap()"><span class="dot" id="pdot"></span><span id="ptxt">Conectar</span></button><button class="btn round" id="helpb" onclick="openHelp(TAB_HELP[tab])" aria-label="Ayuda" style="flex:none;font-weight:800;font-size:18px">?</button><button class="btn round" id="gear" onclick="go('ajustes')" aria-label="Ajustes" style="flex:none"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button></header>
<main id="view"></main>
<nav class="tabs">
  <button data-t="hoy" onclick="go('hoy')"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Diario</button>
  <button data-t="pesar" onclick="go('pesar')"><svg class="i" viewBox="0 0 24 24"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10M12 3v18M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>Pesar</button>
  <button data-t="recetas" onclick="go('recetas')"><svg class="i" viewBox="0 0 24 24"><path d="M3 11h18M19 11v7a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3v-7"/><path d="M8 7c0-1 1-1.5 1-2.5M12 7c0-1 1-1.5 1-2.5M16 7c0-1 1-1.5 1-2.5"/></svg>Recetas</button>
  <button data-t="menu" onclick="go('menu')"><svg class="i" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>Menú</button>
</nav>
<div class="sheet-bg" id="sbg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js" defer></script>
<script>
/* ---------- utilidades ---------- */
const APP_VERSION = '30-sep · 02:00';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const r0 = n => Math.round(n || 0);
const r1 = n => Math.round((n || 0) * 10) / 10;
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const z2 = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${z2(d.getMonth() + 1)}-${z2(d.getDate())}`;
const dayEndH = () => { try { return S.settings.dayEnd ?? 4; } catch (e) { return 4; } };
const todayKey = () => keyOf(new Date(Date.now() - dayEndH() * 3600e3));
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2000); }

const MEALS = [['desayuno', 'Desayuno'], ['comida', 'Comida'], ['merienda', 'Merienda'], ['cena', 'Cena'], ['picoteo', 'Picoteo']];
function guessMeal() { const h = new Date().getHours() + new Date().getMinutes() / 60; if (h < dayEndH()) return 'cena'; return h < 11.5 ? 'desayuno' : h < 16.5 ? 'comida' : h < 19.5 ? 'merienda' : h < 23.5 ? 'cena' : 'picoteo'; }

/* ---------- alimentos básicos (por 100 g, valores aproximados) ---------- */
const BASE_RAW = [
['Aceite de oliva',884,0,0,100,0],['Aguacate',160,2,1.9,14.7,6.7],['Almendras',590,21,6,50,12],['Alubias cocidas',127,8.7,17,0.5,6],
['Arroz blanco cocido',130,2.7,28,0.3,0.4],['Arroz blanco crudo',360,7,79,0.6,1.3],['Atún al natural (escurrido)',116,26,0,1,0],
['Avena en copos',379,13,60,6.5,10],['Azúcar',400,0,100,0,0],['Boniato crudo',86,1.6,20,0.1,3],['Brócoli',34,2.8,4.4,0.4,2.6],
['Cacahuetes',585,26,8,49,8.5],['Calabacín',17,1.2,2.3,0.3,1],['Carne picada de vacuno',215,18.6,0,15,0],['Cebolla',40,1.1,7.6,0.1,1.7],
['Cerdo, lomo crudo',143,21,0,6,0],['Cerveza',43,0.5,3.6,0,0],['Chocolate negro 70%',598,7.8,34,43,11],['Clara de huevo',52,10.9,0.7,0.2,0],
['Crema de cacahuete',600,25,12,50,6],['Espinacas',23,2.9,1.4,0.4,2.2],['Fresas',32,0.7,6,0.3,2],['Garbanzos cocidos',150,8.5,20,2.6,7.6],

{id:'crepes-cottage',name:'Crepes de avena con cottage y fresas',emoji:'🥞',cat:'desayuno',time:15,serv:1,tags:['Alto en proteína','Fin de semana'],

{id:'tostada-cottage',name:'Tostada de cottage con tomate aliñado',emoji:'🍅',cat:'desayuno',time:5,serv:1,tags:['Viral en redes','Sin cocinar'],

{id:'chia-mango',name:'Pudin de chía con mango',emoji:'🥭',cat:'desayuno',time:5,serv:1,tags:['Sin cocinar','Se prepara la noche antes'],

{id:'bagels',name:'Bagels de yogur (2 ingredientes)',emoji:'🥯',cat:'desayuno',time:35,serv:4,tags:['Viral en redes','Horno'],

{id:'pasta-feta',name:'Pasta con feta al horno (versión ligera)',emoji:'🧀',cat:'principal',time:40,serv:3,tags:['Viral en redes','Una sola bandeja'],

{id:'salmon-rice',name:'Bowl de salmón y arroz con soja y aguacate',emoji:'🍚',cat:'principal',time:15,serv:1,tags:['Viral en redes','Aprovechamiento'],

{id:'marry-me',name:'Pollo "marry me" ligero',emoji:'💍',cat:'principal',time:30,serv:3,tags:['Viral en redes','Cremoso'],
ing:[['Pechuga de pollo cruda',600],['Aceite de oliva',10],['Ajo',10],['Tomates secos',40],['Especias variadas',3,'orégano, pimentón, guindilla'],['Caldo de pollo',150],['Leche desnatada',150],['Maicena',8],['Queso fresco batido 0%',150],['Queso parmesano',30],['Espinacas',80]],

{id:'noquis-bandeja',name:'Ñoquis crujientes al horno con pollo y verduras',emoji:'🫑',cat:'principal',time:35,serv:2,tags:['Viral en redes','Una sola bandeja'],

{id:'smash-tacos',name:'Smash tacos de ternera',emoji:'🌮',cat:'principal',time:20,serv:2,tags:['Viral en redes','Capricho sin culpa'],

{id:'arroz-pollo-horno',name:'Arroz con pollo al horno en una bandeja',emoji:'🥘',cat:'principal',time:50,serv:3,tags:['Una sola bandeja','Batch cooking'],

{id:'nuggets',name:'Nuggets de pollo crujientes con salsa de miel y mostaza',emoji:'🍗',cat:'principal',time:25,serv:2,tags:['Freidora de aire','Para peques y mayores'],

{id:'bulgogi-lechuga',name:'Wraps de lechuga con ternera estilo coreano',emoji:'🥬',cat:'principal',time:25,serv:2,tags:['Estilo coreano','Bajo en carbohidratos'],

{id:'arroz-frito',name:'Arroz frito con huevo y verduras',emoji:'🍳',cat:'principal',time:15,serv:2,tags:['Aprovechamiento','Wok'],

{id:'tortilla-patatas',name:'Tortilla de patatas ligera',emoji:'🥔',cat:'principal',time:30,serv:4,tags:['Receta española','Sin freír'],

{id:'cesar',name:'Ensalada César ligera con pollo crujiente',emoji:'🥗',cat:'principal',time:25,serv:2,tags:['Salsa sin mayonesa'],

{id:'pimientos-rellenos',name:'Pimientos rellenos de quinoa y pavo',emoji:'🫑',cat:'principal',time:45,serv:2,tags:['Horno','Mucha fibra'],

{id:'burger-lentejas',name:'Hamburguesas de lentejas y boniato',emoji:'🍔',cat:'principal',time:40,serv:2,tags:['Vegetariana','Mucha fibra'],

{id:'gambas-ajillo',name:'Gambas al ajillo con espaguetis de calabacín',emoji:'🦐',cat:'principal',time:15,serv:2,tags:['Rápido','Bajo en carbohidratos'],

const BASE_FOODS = BASE_RAW.concat(EXTRA_RAW).sort((a, b) => a[0].localeCompare(b[0], 'es')).map(([name, kcal, p, c, f, fib]) => ({ id: 'b_' + norm(name).replace(/[^a-z0-9]+/g, '_'), name, kcal, p, c, f, fib, src: 'base' }));

/* ---------- datos ---------- */
const KEY = 'bascula.v1';
function load() { let d = null; try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {} return normalize(d); }
function normalize(d) {
  const def = { goals: { kcal: 2000, p: 120, c: 220, f: 65, water: 2000 }, foods: {}, diary: {}, containers: [], recents: [], favs: [], water: {}, menu: {}, shopChecked: {}, prices: {}, pantry: {}, templates: [], body: null, tipsSeen: {}, onboarded: 0, settings: { decimals: 0, demo: false } };
  d = Object.assign(def, d || {}); d.goals = Object.assign(def.goals, d.goals); d.settings = Object.assign({ decimals: 0, demo: false, dayEnd: 4 }, d.settings); return d;
}
let S = load();
function save(noSync) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('No se pudo guardar en el móvil'); } if (!noSync && typeof scheduleSync === 'function') scheduleSync(); }
let SHARED = (() => { try { return JSON.parse(localStorage.getItem('bascula.shared')) || {}; } catch (e) { return {}; } })();
const allFoods = () => BASE_FOODS.concat(Object.values(S.foods), Object.values(SHARED).filter(f => !S.foods[f.id]));
const getFood = id => S.foods[id] || BASE_FOODS.find(f => f.id === id) || SHARED[id] || null;
function pushRecent(id) { S.recents = [id].concat(S.recents.filter(x => x !== id)).slice(0, 30); }
function calc(food, g) { const k = (g || 0) / 100; return { kcal: r1(food.kcal * k), p: r1(food.p * k), c: r1(food.c * k), f: r1(food.f * k) }; }
function dayTotals(d) { return (S.diary[d] || []).reduce((a, e) => ({ kcal: a.kcal + e.kcal, p: a.p + e.p, c: a.c + e.c, f: a.f + e.f }), { kcal: 0, p: 0, c: 0, f: 0 }); }

/* ---------- báscula (protocolo Silvergear 4454) ----------
   Servicio 0xFFB0, notificaciones en 0xFFB2. Trama de 20 bytes:
   [0-1] AC 40 cabecera · [2] 0x01 positivo / 0x81 negativo · [3] unidad (00 g, 10 ml)
   [4-6] peso en mg (24 bits, big-endian) · [18] A6 · [19] checksum = suma bytes 2..18 mod 256 */
function parseFrame(dv) {
  const n = dv.byteLength; if (n < 8 || dv.getUint8(0) !== 0xAC || dv.getUint8(1) !== 0x40) return null;
  let sum = 0; for (let i = 2; i < n - 1; i++) sum += dv.getUint8(i);
  if ((sum & 0xFF) !== dv.getUint8(n - 1)) return null;
  const flag = dv.getUint8(2), unit = dv.getUint8(3) === 0x10 ? 'ml' : 'g';
  const mg = (dv.getUint8(4) << 16) | (dv.getUint8(5) << 8) | dv.getUint8(6);
  return { g: (flag & 0x80 ? -1 : 1) * mg / 1000, unit };
}
const scale = { dev: null, connected: false, connecting: false, raw: null, buf: [], stable: false, tare: 0, unit: 'g', manual: false, demo: null };
let viewHook = null, sheetHook = null, subMode = false, subStart = null;
function onReading(g, unit) {
  const now = performance.now(); scale.buf.push({ t: now, g }); scale.buf = scale.buf.filter(x => now - x.t < 1200);
  const vals = scale.buf.map(x => x.g), mn = Math.min(...vals), mx = Math.max(...vals);
  scale.stable = vals.length >= 3 && (mx - mn) < 0.8;
  scale.raw = scale.stable ? vals.reduce((a, b) => a + b, 0) / vals.length : g; // promedio cuando está quieto
  scale.unit = unit; emit();
}
scale.net = () => scale.raw == null ? null : scale.raw - scale.tare;
function emit() { updatePill(); try { viewHook && viewHook(); } catch (e) {} try { sheetHook && sheetHook(); } catch (e) {} }
function fmtW(g) { if (g == null) return '—'; const d = S.settings.decimals; let v = d ? r1(g) : Math.round(g); if (Object.is(v, -0) || Math.abs(v) < (d ? 0.05 : 0.5)) v = 0; return d ? v.toFixed(1).replace('.', ',') : String(v); }
const fmtNum = g => String(Math.max(0, S.settings.decimals ? r1(g) : Math.round(g)));
function doTare(silent) { scale.tare = scale.raw ?? 0; subMode = false; if (!silent) toast('Tara hecha'); emit(); }
function clearTare() { scale.tare = 0; toast('Tara quitada'); emit(); }

const SVC_UUID = '0000ffb0-0000-1000-8000-00805f9b34fb', CHR_UUID = '0000ffb2-0000-1000-8000-00805f9b34fb';
function btError(e) {
  const name = (e && e.name) || '', msg = (e && e.message) || (typeof e === 'string' ? e : '');
  if (name === 'NotFoundError' && !/bluetooth|adapter|unavailable/i.test(msg)) { toast('No se eligió ninguna báscula'); return; }
  openSheet(`<b style="font-size:18px">No se pudo conectar con la báscula</b>
  <ol style="padding-left:18px;line-height:1.6;margin:12px 0"><li><b>Enciéndela</b>: pulsa su botón o pon algo encima hasta que se ilumine la pantalla.</li>
  <li><b>Cierra Silvergear Fit</b> del todo (desliza hacia arriba en la multitarea): la báscula solo acepta una conexión.</li>
  <li>Comprueba que el <b>Bluetooth</b> del iPhone está activado y que Bluefy tiene permiso (Ajustes del iPhone → Bluefy → Bluetooth).</li>
  <li>Acércate a la báscula y vuelve a pulsar <b>Conectar</b>. En la lista debe salir <b>4454</b>.</li></ol>
  ${name || msg ? `<p class="sm mute">Detalle técnico: ${esc([name, msg].filter(Boolean).join(' · '))}</p>` : ''}
  <div class="row"><button class="btn sp" onclick="closeSheet()">Cerrar</button><button class="btn pri sp" onclick="closeSheet();connect()">Reintentar</button></div>`);
}
async function connect() {
  if (S.settings.demo) { startDemo(); return; }
  if (!navigator.bluetooth) { openSheet(`<b style="font-size:18px">Bluetooth no disponible aquí</b><p>Safari no permite conectar con la báscula. Abre esta página en la app gratuita <b>Bluefy</b> (App Store).</p><p class="sm mute">También puedes activar el modo demo en Ajustes para probar la app.</p><button class="btn pri block" onclick="closeSheet()">Entendido</button>`); return; }
  try {
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC_UUID] }, { namePrefix: '4454' }], optionalServices: [SVC_UUID] });
    scale.dev = dev; scale.manual = false;
    dev.addEventListener('gattserverdisconnected', onDisc);
    await attach();
  } catch (e) { scale.connecting = false; updatePill(); btError(e); }
}
async function attach() {
  scale.connecting = true; updatePill();
  const srv = await scale.dev.gatt.connect();
  const svc = await srv.getPrimaryService(SVC_UUID);
  const ch = await svc.getCharacteristic(CHR_UUID);
  ch.addEventListener('characteristicvaluechanged', e => { const r = parseFrame(e.target.value); if (r) onReading(r.g, r.unit); });
  await ch.startNotifications();
  scale.connected = true; scale.connecting = false; updatePill(); toast('Báscula conectada'); refreshScaleViews(); emit();
}
async function onDisc() {
  scale.connected = false; scale.raw = null; scale.buf = []; updatePill(); refreshScaleViews(); emit();
  if (scale.manual) return;
  for (let i = 0; i < 5; i++) { await sleep(1500 * (i + 1)); if (scale.manual) return; try { await attach(); return; } catch (e) {} }
  scale.connecting = false; updatePill(); toast('Báscula desconectada');
}
function disconnect() { scale.manual = true; if (scale.demo) { stopDemo(); return; } try { scale.dev && scale.dev.gatt.disconnect(); } catch (e) {} }

/* modo demo: simula la báscula para probar sin ella */
function startDemo() {
  stopDemo(); scale.connected = true; let cur = 0, target = 0, tick = 0; const seq = [0, 152.4, 152.4, 348.7, 0, 812.3, 64.1];
  scale.demo = setInterval(() => { tick++; if (tick % 28 === 0) target = seq[(tick / 28) % seq.length]; cur += (target - cur) * 0.35; onReading(cur + (Math.random() - 0.5) * 0.3, 'g'); }, 250);
  toast('Modo demo activado'); updatePill(); refreshScaleViews();
}
function stopDemo() { const was = !!scale.demo; clearInterval(scale.demo); scale.demo = null; scale.connected = false; scale.raw = null; scale.buf = []; if (was) refreshScaleViews(); emit(); }

function updatePill() {
  const dot = $('#pdot'), t = $('#ptxt');
  if (scale.connected) { dot.className = 'dot ' + (scale.stable ? 'on' : 'wait'); t.textContent = fmtW(scale.net()) + ' ' + scale.unit; }
  else if (scale.connecting) { dot.className = 'dot wait'; t.textContent = 'Conectando…'; }
  else { dot.className = 'dot'; t.textContent = 'Conectar'; }
}
function refreshScaleViews() { if (tab === 'pesar' || tab === 'ajustes') render(); }
function pillTap() { scale.connected ? go('pesar') : connect(); }

function dayLabel(k) { const t = todayKey(); if (k === t) return 'Hoy'; if (k === addDays(t, -1)) return 'Ayer'; if (k === addDays(t, 1)) return 'Mañana'; return parseKey(k).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'short' }); }

const ring = (pct, size, sw, col, track, inner = '') => { const r = (size - sw) / 2, C = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct || 0)); return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${track}" stroke-width="${sw}"/>${p > 0.005 ? `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C * p} ${C}" transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dasharray .6s ease"/>` : ''}${inner}</svg>`; };
const miniMacro = (l, v, g, col) => `<div class="mini"><div style="display:flex;justify-content:center">${ring(v / g, 58, 7, col, 'var(--soft)', `<text x="29" y="33" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">${Math.round(v / g * 100)}%</text>`)}</div><b style="margin-top:6px">${r0(v)}<span class="mute" style="font-weight:600"> / ${g} g</span></b><span>${l}</span></div>`;
const MEAL_UI = { desayuno: ['☕', 'rgba(245,159,0,.16)'], comida: ['🍽️', 'rgba(18,184,134,.16)'], merienda: ['🍎', 'rgba(230,73,128,.14)'], cena: ['🌙', 'rgba(121,80,242,.15)'], picoteo: ['🥜', 'rgba(160,120,70,.16)'] };

  <label>Objetivo<select id="cx_g">${opt(-0.2, 'Perder grasa (ritmo normal)', b.goal)}${opt(-0.15, 'Perder grasa (ritmo suave)', b.goal)}${opt(0, 'Mantener mi peso', b.goal)}${opt(0.1, 'Ganar músculo', b.goal)}</select></label>
  <button class="btn pri block" style="margin-top:14px" id="cx_go">Calcular</button><div id="cx_res"></div>`);

      <p class="sm mute" style="margin:8px 0 0">Es una estimación: revisa cada 2-3 semanas según cómo evolucione tu peso. Si tienes alguna condición médica o buscas un cambio grande, mejor con un profesional.</p></div>
      <button class="btn pri block" id="cx_ok">Usar este objetivo</button>`;
    $('#cx_ok').onclick = () => { S.goals = { ...S.goals, kcal, p, c, f }; S.body = { sex, age, h, w, act, goal: +$('#cx_g').value }; save(); closeSheet(); render(); toast('Objetivo actualizado'); };
  };
}

const VEGS = ['Cebolla', 'Ajo', 'Pimiento rojo', 'Pimiento verde', 'Calabacín', 'Zanahoria', 'Brócoli', 'Coliflor', 'Berenjena', 'Calabaza', 'Champiñones', 'Boniato crudo', 'Patata cruda', 'Judías verdes', 'Jengibre fresco'];
const PROTS = ['Pechuga de pollo cruda', 'Ternera magra cruda', 'Carne picada de pavo', 'Cerdo, lomo crudo', 'Salmón crudo', 'Bacalao desalado', 'Gambas peladas'];
const FRESH = ['poke', 'quinoa-feta', 'cesar', 'salmorejo', 'pizza-pita', 'tacos', 'smash-tacos', 'salmon-rice', 'bulgogi-lechuga', 'fajitas-bandeja', 'burger', 'nuggets', 'huevos-rotos', 'gambas-ajillo', 'pizza-pollo', 'dumplings-arroz'];
function openBatch(withBreakfast) {
  const days = weekDays(), recs = {}, taper = [];
  days.forEach((d, i) => Object.entries(S.menu[d] || {}).forEach(([slot, ref]) => {
    if ((slot === 'desayuno' || slot === 'merienda') && !withBreakfast) return;
    const r = ref.src === 'lib' ? RECIPES.find(x => x.id === ref.id) : null; if (!r) return;
    const pr = perRation(ref, slot), k = (ref.serv || 1) / r.serv * (pr ? pr.fk : 1), fresh = FRESH.includes(r.id);
    const e = recs[r.id] = recs[r.id] || { r, k: 0, rac: 0, fresh }; e.k += k; e.rac += ref.serv || 1;
    taper.push({ i, slot, r, fresh });
  }));
  const list = Object.values(recs), batch = list.filter(e => !e.fresh), fresh = list.filter(e => e.fresh);
  if (!list.length) { openSheet(`<b style="font-size:18px">👩‍🍳 Batch cooking</b><p class="mute">Primero rellena comidas y cenas en el menú de esta semana.</p><button class="btn pri block" onclick="closeSheet()">Vale</button>`); return; }

  const who = n => batch.filter(e => e.r.ing.some(i => i[0] === n)).map(e => e.r.name).join(', ');
  const oven = batch.filter(e => /horn/i.test(e.r.steps.join(' '))), marinate = batch.filter(e => /marin/i.test(e.r.steps.join(' ')));
  const grains = GRAINS.filter(n => agg[n]), vegs = VEGS.filter(n => agg[n]), prots = PROTS.filter(n => agg[n]);
  const step = (n, title, body) => `<div class="row" style="align-items:flex-start;margin:16px 0"><div style="flex:none;width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center">${n}</div><div class="sp"><b>${title}</b><div class="sm" style="margin-top:4px;line-height:1.5">${body}</div></div></div>`;
  let n = 0; const steps = [];
  if (!batch.length) steps.push('<p class="mute">Las recetas de esta semana son mejor hacerlas en el momento. Te dejo abajo qué puedes adelantar.</p>');

  if (marinate.length) steps.push(step(++n, '🧂 Deja marinando', marinate.map(e => esc(e.r.name)).join(', ') + '. Así coge sabor mientras haces lo demás.'));

  if (vegs.length) steps.push(step(++n, '🔪 Corta todas las verduras de golpe', vegs.map(g => `${esc(g)}: <b>${Math.round(agg[g])} g</b>`).join(' · ') + '<br><span class="mute">Sepáralas en boles por receta.</span>'));
  if (prots.length) steps.push(step(++n, '🥩 Prepara las proteínas', prots.map(g => `${esc(g)}: <b>${Math.round(agg[g])} g</b>`).join(' · ')));
  if (batch.length) steps.push(step(++n, '🍳 Cocina de la más larga a la más corta', batch.sort((a, b) => b.r.time - a.r.time).map(e => `<div class="row" style="margin:6px 0"><span class="sp">${e.r.emoji} ${esc(e.r.name)} <span class="mute">· ${e.rac} rac. · ${e.r.time} min</span></span><button class="btn small" onclick="libCtxMeal=null;openLib('${e.r.id}',${e.rac},true)">Ver</button></div>`).join('')));

  openSheet(`<div class="row"><b class="sp" style="font-size:19px">👩‍🍳 Plan de batch cooking</b><button class="btn ghost" onclick="closeSheet()">Cerrar</button></div>
  <p class="sm mute" style="margin:6px 0">${batch.length} recetas para cocinar de una vez (${batch.reduce((a, e) => a + e.rac, 0)} raciones), ya ajustadas a tus calorías.</p>

async function syncShop(wk) {
  if (!syncReady() || shopBusy) return false; shopBusy = true;

      const rd = remote || {}; let push = false;
      for (const [n, e] of Object.entries(rd)) { const l = loc[n], ld = (l && l.d) || ''; if ((!l || (e.d || '') > ld) && JSON.stringify(l) !== JSON.stringify(e)) { loc[n] = e; changed = true; } }
      const out = { ...rd };
      for (const [n, l] of Object.entries(loc)) { const lo = typeof l === 'object' ? l : { v: 1, d: '1970-01-01T00:00:00.000Z' }; if (!rd[n] || (lo.d || '') > (rd[n].d || '')) { out[n] = lo; push = true; } }

/* ---------- COPIA EN GITHUB ---------- */
const SYNC_KEY = 'bascula.sync';
let SY = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; } })();
const saveSync = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); } catch (e) {} };
const syncReady = () => !!(SY.repo && SY.token && SY.profile);
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = b => decodeURIComponent(escape(atob(b.replace(/\s/g, ''))));
async function gh(path, opts = {}) {
  const r = await fetch(`https://api.github.com/repos/${SY.repo}/contents/${path}${opts.method ? '' : (path.includes('?') ? '&' : '?') + '_=' + Date.now()}`, { ...opts, cache: 'no-store', headers: { Authorization: 'Bearer ' + SY.token, Accept: 'application/vnd.github+json', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
  if (r.status === 404) return null;
  if (r.status === 401) throw new Error('token no válido');
  if (r.status === 403) throw new Error('el token no tiene permiso de escritura en ese repositorio');
  if (r.status === 409 || r.status === 422) throw Object.assign(new Error('conflicto al guardar'), { conflict: true });
  if (!r.ok) throw new Error('GitHub respondió ' + r.status);
  return r.json();
}
/* lee, calcula y escribe; si GitHub dice que la versión ha cambiado, vuelve a leer y reintenta */
async function ghUpdate(path, make, msg) {
  for (let i = 0; i < 4; i++) {
    const cur = await ghGet(path), next = make(cur.data);
    if (next == null) return cur.data;
    try { await ghPut(path, next, cur.sha, msg); return next; }
    catch (e) { if (!e.conflict || i === 3) throw e; await sleep(700 * (i + 1) + Math.random() * 400); }
  }
}
async function ghGet(path) { const j = await gh(path); return j ? { data: JSON.parse(b64dec(j.content)), sha: j.sha } : { data: null, sha: null }; }
async function ghPut(path, data, sha, msg) { return gh(path, { method: 'PUT', body: JSON.stringify({ message: msg, content: b64enc(JSON.stringify(data)), ...(sha ? { sha } : {}) }) }); }
const lastPushed = { me: null, prices: null };
let syncTimer = null, syncBusy = false;
function scheduleSync() { if (!SY.auto || !syncReady()) return; if (!SY.pending) { SY.pending = 1; saveSync(); } clearTimeout(syncTimer); syncTimer = setTimeout(() => syncPush(true), 15000); }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && syncTimer) { clearTimeout(syncTimer); syncTimer = null; syncPush(true); }
  if (document.visibilityState === 'visible' && SY.pending && syncReady()) setTimeout(() => syncPush(true), 1500);

window.addEventListener('online', () => { if (SY.pending && syncReady()) syncPush(true); });
const isNetErr = e => e instanceof TypeError || /load failed|failed to fetch|network|internet|offline|timed out/i.test((e && e.message) || '');
const syncColor = m => /^Error/.test(m || '') ? 'var(--bad)' : /^Pendiente|^Guardando/.test(m || '') ? 'var(--warn)' : 'var(--acc)';
function setSyncMsg(m) { SY.msg = m; saveSync(); const el = $('#symsg'); if (el) { el.textContent = m; el.style.color = syncColor(m); } }
let syncAgain = false;
async function syncPush(silent) {
  if (!syncReady()) return; if (syncBusy) { syncAgain = true; return; } syncBusy = true;
  try {
    let merged = S.prices;
    await ghUpdate('precios.json', remote => { merged = mergePrices(remote || {}, S.prices); return JSON.stringify(merged) === JSON.stringify(remote || {}) ? null : merged; }, 'Precios actualizados');
    S.prices = merged; save(true); lastPushed.prices = JSON.stringify(merged);
    const mine = Object.fromEntries(Object.entries(S.foods).filter(([, f]) => f.src === 'off' || f.src === 'custom'));
    let allP = mine;
    await ghUpdate('productos.json', remote => { allP = { ...(remote || {}), ...mine }; return Object.keys(mine).some(k => JSON.stringify((remote || {})[k]) !== JSON.stringify(mine[k])) ? allP : null; }, 'Productos');
    SHARED = allP; try { localStorage.setItem('bascula.shared', JSON.stringify(SHARED)); } catch (e) {}
    const body = { ...S }; delete body.prices; const ms = JSON.stringify(body);
    if (ms !== lastPushed.me) { await ghUpdate(`perfiles/${SY.profile}.json`, remote => JSON.stringify(remote) === ms ? null : body, `Datos de ${SY.profile}`); lastPushed.me = ms; }
    SY.pending = 0; setSyncMsg('Guardado en GitHub · ' + new Date().toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }));
    if (!silent) toast('Guardado en GitHub');
  } catch (e) {
    if (e.conflict) { SY.pending = 1; setSyncMsg('Pendiente de guardar: GitHub estaba ocupado, se reintentará solo'); clearTimeout(syncTimer); syncTimer = setTimeout(() => syncPush(true), 20000); if (!silent) toast('GitHub estaba ocupado: lo reintento en unos segundos'); }
    else if (isNetErr(e)) { SY.pending = 1; setSyncMsg('Pendiente de guardar: sin conexión, se reintentará solo'); clearTimeout(syncTimer); syncTimer = setTimeout(() => syncPush(true), 60000); if (!silent) toast('Sin conexión: se guardará en cuanto vuelva'); }
    else { setSyncMsg('Error al guardar: ' + e.message); if (!silent) toast('Error: ' + e.message); }
  }
  finally { syncBusy = false; if (syncAgain) { syncAgain = false; lastPushed.me = null; setTimeout(() => syncPush(true), 2000); } }
}
async function syncPull() {
  try {
    const me = await ghGet(`perfiles/${SY.profile}.json`), pr = await ghGet('precios.json');
    if (!me.data) { toast('No hay datos de "' + SY.profile + '" en GitHub todavía'); return; }
    S = normalize(me.data); S.prices = mergePrices(pr.data || {}, {}); save(true);
    lastPushed.me = JSON.stringify((({ prices, ...rest }) => rest)(S)); lastPushed.prices = JSON.stringify(S.prices);
    setSyncMsg('Restaurado desde GitHub · ' + new Date().toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }));
    closeSheet(); render(); toast('Datos restaurados');
  } catch (e) { toast('Error: ' + e.message); }
}

function vProg(v) {
  const n = progN, days = Array.from({ length: n }, (_, i) => addDays(todayKey(), i - n + 1)), tot = days.map(dayTotals), g = S.goals;
  const logged = days.map((d, i) => ({ d, t: tot[i] })).filter(x => (S.diary[x.d] || []).length);
  const avg = k => logged.length ? logged.reduce((a, x) => a + x.t[k], 0) / logged.length : 0;
  const inGoal = logged.filter(x => Math.abs(x.t.kcal - g.kcal) <= g.kcal * 0.1).length;
  const max = Math.max(g.kcal * 1.2, ...tot.map(t => t.kcal)), W = 340, H = 160, bw = W / n;
  const bars = tot.map((t, i) => { const h = t.kcal / max * (H - 20); return `<rect x="${i * bw + bw * 0.15}" y="${H - h}" width="${bw * 0.7}" height="${h}" rx="3" fill="${t.kcal > g.kcal * 1.1 ? 'var(--warn)' : 'url(#pg)'}"/>`; }).join('');
  const gy = H - g.kcal / max * (H - 20);
  const top = {}; days.forEach(d => (S.diary[d] || []).forEach(e => { top[e.name] = (top[e.name] || 0) + e.kcal; }));
  const topL = Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 5);
  v.innerHTML = `<div class="seg" style="margin-top:8px"><button class="${n === 7 ? 'on' : ''}" onclick="progN=7;render()">7 días</button><button class="${n === 30 ? 'on' : ''}" onclick="progN=30;render()">30 días</button></div>
  <div class="card"><b>Calorías por día</b>
  <svg viewBox="0 0 ${W} ${H + 18}" width="100%" style="margin-top:8px"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12b886"/><stop offset="1" stop-color="#0b8ea8"/></linearGradient></defs>${bars}<line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--mute)" stroke-dasharray="4 4"/>
  ${n === 7 ? days.map((d, i) => `<text x="${i * bw + bw / 2}" y="${H + 14}" text-anchor="middle" font-size="11" fill="var(--mute)">${parseKey(d).toLocaleDateString('es-ES', { weekday: 'short' }).slice(0, 2)}</text>`).join('') : ''}</svg>
  <p class="sm mute" style="margin:4px 0 0">Línea discontinua: objetivo (${g.kcal} kcal)</p></div>
  <div class="card"><b>Medias (días registrados: ${logged.length})</b>
  <div class="grid4">${nut('kcal', r0(avg('kcal')), 'var(--acc)')}${nut('Proteína', r0(avg('p')), 'var(--p)')}${nut('Carbos', r0(avg('c')), 'var(--c)')}${nut('Grasa', r0(avg('f')), 'var(--f)')}</div>
  <p class="sm mute" style="margin:0">Días dentro de ±10% del objetivo: <b>${inGoal}</b> de ${logged.length}</p></div>
  <div class="card"><b>Lo que más calorías aporta</b>${topL.length ? topL.map(([nm, k]) => `<div class="item" style="cursor:default"><div class="sp">${esc(nm)}</div><b>${r0(k)}</b><span class="sm mute">kcal</span></div>`).join('') : '<p class="sm mute">Sin datos todavía.</p>'}</div>`;
}

  <div class="card"><button class="btn bad block" onclick="confirmSheet('¿Borrar TODOS los datos de este móvil?', ()=>{localStorage.removeItem(KEY);S=load();render();toast('Datos borrados')}, 'Borrar todo')">Borrar todos los datos</button></div>
  <p class="sm mute" style="text-align:center">Versión ${APP_VERSION} · Datos de productos: Open Food Facts (ODbL). Valores de básicos aproximados.</p>`;
  const hint = () => { const k = (+$('#g_p').value) * 4 + (+$('#g_c').value) * 4 + (+$('#g_f').value) * 9; $('#g_hint').textContent = `Tus macros suman ${r0(k)} kcal (objetivo: ${$('#g_k').value || 0}).`; };
  ['#g_p', '#g_c', '#g_f', '#g_k'].forEach(id => $(id).oninput = hint); hint();
  $('#g_ok').onclick = () => { const n = id => Math.max(0, parseInt($(id).value) || 0); S.goals = { kcal: n('#g_k') || 2000, p: n('#g_p') || 1, c: n('#g_c') || 1, f: n('#g_f') || 1, water: n('#g_w') || 2000 }; save(); toast('Objetivos guardados'); };
  $('#s_de').onchange = e => { S.settings.dayEnd = +e.target.value; save(); day = todayKey(); toast('Guardado'); };
  bindSyncCard();
  $('#s_demo').onchange = e => { S.settings.demo = e.target.checked; save(); if (!e.target.checked && scale.demo) stopDemo(); render(); };
}
function setDec(d) { S.settings.decimals = d; save(); render(); }
function delContainer(id) { S.containers = S.containers.filter(c => c.id !== id); save(); render(); }
function editFood(id) {
  const f = S.foods[id]; openFoodForm(f, () => { closeSheet(); render(); });
  const b = document.createElement('button'); b.className = 'btn bad block'; b.style.marginTop = '8px'; b.textContent = 'Borrar alimento';
  b.onclick = () => confirmSheet('¿Borrar "' + f.name + '"? Lo ya registrado en el diario se conserva.', () => { delete S.foods[id]; S.favs = S.favs.filter(x => x !== id); S.recents = S.recents.filter(x => x !== id); save(); render(); });
  $('#sheet').appendChild(b);
}
function exportData() {
  const json = JSON.stringify(S);
  openSheet(`<b style="font-size:18px">Exportar datos</b><p class="sm mute">Copia este texto y guárdalo (Notas, correo…), o descarga el archivo.</p>
  <textarea id="exj" rows="6" readonly>${esc(json)}</textarea>
  <div class="row" style="margin-top:10px"><button class="btn sp" id="exc">Copiar</button><a class="btn sp pri" style="text-align:center;text-decoration:none" download="bascula-${todayKey()}.json" href="data:application/json;charset=utf-8,${encodeURIComponent(json)}">Descargar</a></div>
  <button class="btn ghost block" onclick="closeSheet()">Cerrar</button>`);
  $('#exc').onclick = async () => { try { await navigator.clipboard.writeText(json); toast('Copiado'); } catch (e) { $('#exj').select(); document.execCommand('copy'); toast('Copiado'); } };
}
function importData() {
  openSheet(`<b style="font-size:18px">Importar datos</b><p class="sm mute">Pega aquí una copia exportada o elige el archivo. Sustituye los datos actuales.</p>
  <textarea id="imj" rows="6" placeholder="Pega aquí…"></textarea><input type="file" id="imf" accept=".json,application/json" style="margin-top:8px">
  <div class="row" style="margin-top:10px"><button class="btn sp" onclick="closeSheet()">Cancelar</button><button class="btn pri sp" id="imok">Importar</button></div>`);
  $('#imf').onchange = async e => { const f = e.target.files[0]; if (f) $('#imj').value = await f.text(); };
  $('#imok').onclick = () => { try { const d = JSON.parse($('#imj').value); if (!d || typeof d !== 'object' || !d.diary) throw 0; localStorage.setItem(KEY, JSON.stringify(d)); S = load(); closeSheet(); render(); toast('Datos importados'); } catch (e) { toast('El texto no es una copia válida'); } };
}

const HELP = [
{id:'novedades',icon:'🆕',title:'Novedades',tabs:[],body:`${NEWS.map(n => `<p style="margin-top:12px"><b>${n.v}</b></p><ul>${n.items.map(i => `<li>${i}</li>`).join('')}</ul>`).join('')}`},
{id:'empezar',icon:'🚀',title:'Primeros pasos',tabs:['hoy'],body:`
<p>La app vive en una página web que se abre con <b>Bluefy</b> (gratis en la App Store), porque Safari no deja conectar con la báscula por Bluetooth.</p>
<ol><li>Abre Bluefy y entra en la dirección de la app. Guárdala en favoritos para tenerla a mano.</li>
<li>Arriba a la derecha pulsa <b>Conectar</b> y elige la báscula (sale como <b>4454</b>). La báscula tiene que estar encendida.</li>
<li>Ve a <b>Ajustes → 🧮 Calcular</b> para poner tu objetivo de calorías real. Todo lo demás (recetas, sugerencias, menú) se ajusta a él.</li>
<li>Opcional pero muy recomendable: configura la <b>copia en GitHub</b> para no perder nunca los datos y compartir precios y lista de la compra con tu pareja.</li></ol>`},
{id:'bascula',icon:'⚖️',title:'Pesar con la báscula',tabs:['pesar'],body:`
<p>La pestaña <b>Pesar</b> muestra el peso en vivo. El anillo gira mientras el peso se mueve y se cierra en verde cuando está <b>estable</b>: la app solo registra pesos estables.</p>
<ul><li><b>Tara:</b> pone a cero lo que haya encima (el plato, por ejemplo). La hace la app, no hace falta tocar la báscula.</li>
<li><b>Sin tara:</b> vuelve a mostrar el peso total.</li>
<li><b>Recipiente:</b> guarda lo que pesan tus platos y táperes. Luego eliges "plato hondo" y lo resta solo, aunque ya tenga comida dentro.</li>
<li><b>Modo resta:</b> para cosas que sacas de un bote. Deja el bote de frutos secos en la báscula, activa el modo, saca lo que vas a comer y la app te dice cuánto has sacado.</li>
<li>En <b>Ajustes</b> puedes ver el peso con décimas (0,1 g). Es orientativo: la báscula es fiable al gramo.</li></ul>`},
{id:'saludable',icon:'🌿',title:'¿Es saludable? y alternativas',tabs:['pesar'],body:`
<p>Al abrir cualquier alimento aparece una tarjeta con un veredicto (en los productos envasados, con sus datos de Open Food Facts; en los básicos como fruta, pollo o arroz, con una valoración general del alimento):</p>
<ul><li>🟢 <b>Saludable</b>: Nutri-Score A o B y no es ultraprocesado.</li><li>🟡 <b>Con moderación</b>: Nutri-Score C, o A/B pero ultraprocesado.</li><li>🔴 <b>Poco saludable</b>: Nutri-Score D o E.</li></ul>
<p>Debajo te dice por qué: "Mucho azúcar", "Ultraprocesado", "Poca sal", "Rico en fibra"…</p>
<p>Si no es saludable, pulsa <b>🌿 Ver alternativas más sanas</b>. En productos envasados busca otros de la misma categoría con mejor valoración y te dice en qué tiendas se venden. En los básicos te propone cambios sencillos (arroz blanco → integral o quinoa, mantequilla → aceite de oliva…). En todas verás cuántas calorías te ahorras con el mismo peso. Toca uno para ver su ficha y apuntarlo.</p>
<p>El puntito de color junto a cada producto en las búsquedas te da el veredicto de un vistazo. Es una guía orientativa basada en Open Food Facts, no un consejo médico; las tiendas las indican los usuarios y pueden faltar.</p>`},
{id:'escanear',icon:'📷',title:'Escanear productos',tabs:['pesar'],body:`
<p>En <b>Pesar → 📷 Escanear producto</b> (o con el botón ▥ al buscar un alimento) lees el código de barras de cualquier producto envasado.</p>
<ul><li>Te muestra la foto, el Nutri-Score, y las calorías y macros <b>de lo que estás pesando en ese momento</b>, que cambian en vivo con la báscula.</li>
<li>Si la cámara no se abre dentro de Bluefy, pulsa <b>"hacer foto al código"</b> o escribe el número a mano.</li>
<li>Los datos vienen de <b>Open Food Facts</b>, una base de datos abierta con millones de productos (incluidas marcas blancas).</li>
<li>Si un producto no aparece, lo creas una vez copiando la etiqueta (valores por 100 g). Queda guardado y, con GitHub activado, también le aparece a tu pareja.</li></ul>`},
{id:'diario',icon:'📅',title:'El diario',tabs:['hoy'],body:`
<ul><li>La tarjeta verde te dice cuántas calorías <b>te quedan</b>. Debajo, cómo vas de proteína, carbohidratos y grasa.</li>
<li>Pulsa <b>+ Añadir</b> en cualquier comida para buscar un alimento, escanearlo o elegir uno reciente o favorito (★).</li>
<li>Toca cualquier alimento ya apuntado para cambiar la cantidad, <b>moverlo a otra comida u otro día</b> (botones Anteayer · Ayer · Hoy · 📅 Otro) o borrarlo con 🗑.</li>
<li>En la ficha de cada alimento ajustas el peso con <b>− / +</b>, los atajos de 25 a 200 g o la báscula en vivo. El botón de abajo te dice cuántas calorías vas a apuntar antes de confirmar.</li>
<li>Con las flechas ‹ › cambias de día. Puedes copiar un día entero o una comida de ayer.</li>
<li><b>Cenas de madrugada:</b> el día termina a las <b>4:00</b>, no a medianoche. Si cenas a la 1:00, se apunta en la cena del día anterior. La hora se cambia en Ajustes → "El día termina a las".</li>
<li>El agua se suma de vaso en vaso (250 ml).</li></ul>`},
{id:'habituales',icon:'⭐',title:'Comidas habituales',tabs:['hoy'],body:`
<p>Si desayunas casi siempre lo mismo, apúntalo una vez y pulsa <b>⭐</b> en esa comida para guardarlo como habitual.</p>
<p>A partir de ahí aparece un botón <b>⚡</b> en esa comida: un toque y queda todo apuntado con sus cantidades. Las borras desde Ajustes → Comidas habituales.</p>`},
{id:'sugerir',icon:'✨',title:'¿Qué como ahora?',tabs:['hoy'],body:`
<p>En el Diario, <b>✨ ¿Qué como ahora?</b> mira lo que te queda del día, reserva hueco para las comidas que faltan y te propone recetas <b>con las cantidades ya ajustadas</b> a ese hueco.</p>
<p>Aparecen primero las que más proteína aportan. Puedes cambiar de comida con los botones de arriba (desayuno, comida…). Al abrir una receta verás exactamente cuántos gramos de cada cosa te tocan.</p>`},
{id:'objetivo',icon:'🧮',title:'Tu objetivo de calorías',tabs:['ajustes'],body:`
<p>En <b>Ajustes → 🧮 Calcular</b> metes edad, altura, peso, actividad y qué buscas (perder grasa, mantener o ganar músculo). La app calcula tus calorías y macros con la fórmula de Mifflin-St Jeor.</p>
<ul><li>Nunca te propone comer por debajo de tu metabolismo basal.</li>
<li>Es una estimación: si en 2-3 semanas tu peso no va como esperas, ajusta 100-200 kcal.</li>
<li>El objetivo se reparte entre comidas para las recetas "a tu medida": desayuno 25%, comida 35%, merienda 10% y cena 30%.</li></ul>`},
{id:'recetas',icon:'🍲',title:'Recetas a tu medida',tabs:['recetas'],body:`
<p>El <b>Recetario</b> tiene ${RECIPES.length} recetas ligeras, con buscador y filtros por tipo.</p>
<ul><li><b>🎯 A mi medida</b> (activado por defecto): los gramos se recalculan para que tu ración encaje con tu objetivo. Tu pareja, con su objetivo, verá otras cantidades.</li>
<li><b>Receta original:</b> las cantidades tal cual.</li>
<li>Con <b>− / +</b> cambias las raciones y se recalcula todo.</li>
<li><b>+ Ración al diario</b> apunta tu ración directamente.</li>
<li>Toca un ingrediente para apuntar su precio en cada súper.</li></ul>`},
{id:'cocinar',icon:'👨‍🍳',title:'Cocinar con la báscula',tabs:['recetas'],body:`
<p>En cualquier receta, <b>⚖️ Cocinar con la báscula</b> te guía ingrediente a ingrediente:</p>
<ol><li>Pon la olla o el bol en la báscula (la app hace la tara sola).</li>
<li>Te dice qué echar y cuánto. La barra se va llenando y te avisa de "faltan 20 g" o "te pasas 5 g".</li>
<li>Pulsa <b>Hecho ✓</b> y pasa al siguiente, con la tara hecha automáticamente.</li>
<li>Al terminar, cocina siguiendo los pasos (📖 Ver pasos) y <b>pesa el resultado cocinado</b> sin la olla.</li>
<li>Se guarda en <b>Mis recetas</b> con el peso real de cada ración. Así, al comer, solo pesas tu plato.</li></ol>
<p>En <b>Mis recetas → + Nueva receta propia</b> puedes hacer lo mismo con las recetas de casa.</p>`},
{id:'menu',icon:'🍽️',title:'Menú semanal',tabs:['menu'],body:`
<ul><li>Cada día tiene desayuno, comida, merienda y cena. Toca un hueco para elegir receta.</li>
<li><b>✨ Autorellenar</b> elige recetas variadas sin repetir. Puede rellenar solo los huecos o rehacer toda la semana.</li>
<li>Toca un plato del menú para cambiar cuántas <b>raciones</b> vas a cocinar, cambiar la receta, apuntarlo al diario o quitarlo.</li>
<li>Cada plato viene <b>ajustado a tus calorías</b>. Se puede desactivar plato a plato.</li>
<li>Con ‹ › preparas la semana que viene.</li></ul>`},
{id:'compra',icon:'🛒',title:'Lista de la compra',tabs:['menu'],body:`
<p><b>🛒 Lista compra</b> suma todos los ingredientes del menú de la semana, en las cantidades de cada uno.</p>
<ul><li>Agrupa cada producto en el súper donde es <b>más barato</b> (según los precios que hayáis apuntado) y calcula cuántos paquetes comprar y el total.</li>
<li>Marca las casillas según lo metes en el carro.</li>
<li><b>🥫</b> significa "ya lo tengo en casa": pasa a la despensa y deja de salir.</li>
<li><b>👥 Sumar los demás</b> junta en una sola lista tu menú y el de tu pareja, cada uno con sus cantidades.</li>
<li>Con GitHub activado es <b>compartida en tiempo real</b>: lo que marca uno le aparece al otro en unos segundos, con su nombre. Ideal para dividiros el súper.</li>
<li><b>📋 Copiar lista</b> la pasa a WhatsApp o a Notas.</li></ul>`},
{id:'precios',icon:'💶',title:'Precios y súper más barato',tabs:['menu'],body:`
<p>Los supermercados no publican sus precios, así que los apuntáis vosotros y la app hace las cuentas.</p>
<ul><li>Toca cualquier producto en la lista o en una receta, o entra en <b>Menú → 💶 Precios</b>.</li>
<li>Para cada súper escribe el <b>precio del paquete</b> y lo que <b>pesa</b> (1 kg = 1000 g, 1 L ≈ 1000 g, docena de huevos ≈ 700 g).</li>
<li>La app calcula el €/kg y elige la tienda más barata.</li>
<li>Con GitHub, los precios se comparten: lo que apunta uno le sirve al otro. En dos o tres compras tendréis casi todo.</li></ul>`},
{id:'despensa',icon:'🥫',title:'Despensa',tabs:['menu'],body:`
<ul><li>En <b>Menú → 🥫 Despensa</b> apuntas lo que tienes en casa. Si pones una cantidad, se descuenta; si la dejas vacía, significa "tengo de sobra".</li>
<li><b>+ Básicos de cocina</b> añade de golpe aceite, especias, ajo, sal…</li>
<li><b>🍳 ¿Qué puedo cocinar?</b> ordena las recetas según cuántos ingredientes tienes y te dice qué te falta.</li></ul>`},
{id:'batch',icon:'👩‍🍳',title:'Batch cooking',tabs:['menu'],body:`
<p>Para cocinar toda la semana de una vez (por ejemplo, el domingo). En <b>Menú → 👩‍🍳 Batch</b> la app lee el menú y te da un plan:</p>
<ol><li>Qué meter al horno (aprovechándolo para varias cosas a la vez).</li><li>Qué dejar marinando.</li><li>Cuánto arroz, quinoa o pasta cocer en total.</li><li>Cuánta verdura cortar y cuánta proteína preparar.</li><li>En qué orden cocinar las recetas.</li><li>Qué táper va a la nevera (3-4 días) y cuál al congelador.</li></ol>
<p>Las recetas que están mejor recién hechas (poke, ensaladas, tacos…) salen aparte.</p>`},
{id:'github',icon:'☁️',title:'Copia en GitHub y compartir',tabs:['ajustes'],body:`
<p>Tus datos se guardan en el móvil. Si borras la app o la caché de Bluefy, se perderían. Con la copia en GitHub, no.</p>
<ol><li>Crea una cuenta en github.com y un repositorio <b>privado</b> llamado <b>bascula-datos</b>.</li>
<li>Crea un <b>Fine-grained token</b> con acceso solo a ese repositorio y permiso <b>Contents: Read and write</b>. Los pasos detallados están en Ajustes.</li>
<li>En Ajustes pega el repositorio, el token y <b>tu nombre</b>. Tu pareja pone lo mismo con su propio nombre.</li></ol>
<p>A partir de ahí se guarda solo unos segundos después de cada cambio. Si reinstalas: vuelve a poner los tres datos y pulsa <b>Restaurar</b>.</p>
<p>El mensaje de estado en Ajustes te dice cómo va:</p>
<ul><li>🟢 <b>Verde</b> "Guardado en GitHub": todo a salvo.</li>
<li>🟡 <b>Ámbar</b> "Pendiente de guardar": se cortó la conexión (por ejemplo, al bloquear el móvil mientras guardaba). La app lo reintenta sola; no tienes que hacer nada.</li>
<li>🔴 <b>Rojo</b> "Error al guardar": algo que sí hay que arreglar, normalmente el token caducado o sin permisos. Crea uno nuevo y pégalo en los dos móviles.</li></ul>
<p>Los datos nunca se pierden por un fallo de guardado: siempre quedan en el móvil hasta que se suben.</p>
<p>Además de la copia, esto activa: precios compartidos, productos escaneados compartidos, sumar el menú de tu pareja y la lista de la compra en tiempo real.</p>`},
{id:'progreso',icon:'📈',title:'Progreso',tabs:['progreso'],body:`
<p>Al final del Diario, <b>Mi progreso</b> muestra las calorías de los últimos 7 o 30 días frente a tu objetivo, tus medias de macros, cuántos días has estado dentro de ±10% del objetivo y qué alimentos te aportan más calorías.</p>`},
{id:'problemas',icon:'🛟',title:'Preguntas y problemas frecuentes',tabs:['ajustes','pesar'],body:`
<ul><li><b>No encuentra la báscula:</b> enciéndela poniendo algo encima y <b>cierra la app Silvergear Fit</b> del todo (la báscula solo acepta una conexión). Tiene que abrirse desde Bluefy, no desde Safari.</li>
<li><b>Se desconecta:</b> la báscula se apaga sola al rato. La app intenta reconectar; si no, pulsa Conectar otra vez.</li>
<li><b>El peso no se queda "estable":</b> apoya la báscula en una superficie firme y sin vibraciones.</li>
<li><b>La cámara no abre:</b> usa "hacer foto al código" o escribe el número. Revisa que Bluefy tenga permiso de cámara en Ajustes del iPhone.</li>
<li><b>Un producto tiene datos raros:</b> los de Open Food Facts los sube la gente. Edítalo en Ajustes → Mis alimentos.</li>
<li><b>"Load failed" o "Pendiente de guardar":</b> se cortó la conexión mientras guardaba. No se ha perdido nada; la app lo reintenta sola. Si quieres, pulsa Guardar ahora.</li>
<li><b>"GitHub respondió 409" o "GitHub estaba ocupado":</b> dos guardados muy seguidos chocaron. La app lo resuelve sola reintentando; no se pierde nada.</li>
<li><b>Error al guardar en GitHub (en rojo):</b> revisa que el repositorio se escriba como usuario/nombre y que el token tenga "Contents: Read and write" y no haya caducado.</li>
<li><b>Apunté la cena en el día que no era:</b> tócala en el Diario, elige el día correcto (Ayer, Anteayer u Otro) y pulsa Guardar.</li>
<li><b>No sale la tarjeta de "¿Es saludable?":</b> sale en productos envasados y en los básicos. No sale en recetas ni en condimentos (especias, vinagre…). En alimentos creados a mano hay que rellenar azúcares y sal. Si falta, comprueba que tienes la última versión.</li>
<li><b>No veo lo último que se ha añadido:</b> mira la versión en Ajustes (abajo del todo) y compárala con la de 🆕 Novedades. GitHub tarda hasta 10 minutos en publicar una versión nueva; después recarga la página en Bluefy.</li>
<li><b>¿Puedo tener un icono en la pantalla de inicio?</b> Sí: en la app Atajos crea un atajo con la acción "Abrir app → Bluefy", llámalo Báscula y pulsa "Añadir a pantalla de inicio". Desde Safari no sirve, porque Safari no tiene Bluetooth.</li>
<li><b>Quiero probar sin báscula:</b> Ajustes → Modo demo.</li></ul>`}
];
const TAB_HELP = { hoy: 'diario', pesar: 'bascula', recetas: 'recetas', menu: 'menu', progreso: 'progreso', ajustes: 'github' };
const TIPS = {
  hoy: '¿No sabes qué comer? Pulsa <b>✨ ¿Qué como ahora?</b> y te propongo recetas que encajan en lo que te queda hoy.',
  pesar: 'Pon el plato, pulsa <b>Tara</b> y añade la comida. Con <b>📷 Escanear</b> ves al momento las calorías de lo que pesas.',
  recetas: 'Las recetas salen <b>a tu medida</b>: los gramos se ajustan a tus calorías. Prueba <b>⚖️ Cocinar con la báscula</b>.',
  menu: 'Pulsa <b>✨ Autorellenar</b> y luego <b>🛒 Lista compra</b>: en dos toques tienes la semana planificada y la compra hecha.'
};
function tipCard(t) {
  if (!TIPS[t] || (S.tipsSeen || {})[t]) return '';
  return `<div class="card row" style="background:rgba(18,184,134,.1);box-shadow:none;align-items:flex-start;margin-top:4px"><span style="font-size:20px">💡</span><div class="sp sm" style="line-height:1.45">${TIPS[t]}<div style="margin-top:6px"><button class="btn ghost small" style="padding:0" onclick="openHelp('${TAB_HELP[t]}')">Ver cómo funciona ›</button></div></div><button class="btn ghost small" onclick="S.tipsSeen=S.tipsSeen||{};S.tipsSeen['${t}']=1;save();render()">✕</button></div>`;
}
function openHelp(focus, q) {
  openSheet(`<div class="row"><b class="sp" style="font-size:20px">📖 Guía de uso</b><button class="btn ghost" onclick="closeSheet()">Cerrar</button></div>
  <input id="hq" placeholder="Buscar: tara, precios, GitHub, cámara…" autocomplete="off" value="${esc(q || '')}" style="margin:8px 0 4px">
  <div id="hl"></div>
  <button class="btn block" style="margin-top:12px" onclick="startTour()">▶️ Ver el tour de bienvenida</button>`);
  const draw = () => { const nq = norm($('#hq').value), list = HELP.filter(h => !nq || norm(h.title + ' ' + h.body.replace(/<[^>]+>/g, ' ')).includes(nq));
    $('#hl').innerHTML = list.length ? list.map(h => `<details class="help" id="h_${h.id}" ${h.id === focus || (nq && list.length <= 3) ? 'open' : ''}><summary><span class="mealic" style="width:36px;height:36px;font-size:18px;background:var(--soft)">${h.icon}</span><b class="sp">${h.title}</b><span class="mute chev">›</span></summary><div class="helpb">${h.body}</div></details>`).join('') : '<p class="mute sm">No encuentro nada con eso. Prueba con otra palabra.</p>'; };
  $('#hq').oninput = draw; draw();
  if (focus) setTimeout(() => { const el = $('#h_' + focus); if (el) $('#sheet').scrollTop = el.offsetTop - 20; }, 60);
}
const TOUR = [
  ['👋', 'Bienvenidos', 'Esta app se conecta a vuestra báscula de cocina para contar calorías pesando de verdad, con recetas a vuestra medida, menú semanal y lista de la compra compartida.'],
  ['⚖️', 'Conecta la báscula', 'Abre la app desde <b>Bluefy</b>, enciende la báscula y pulsa <b>Conectar</b> arriba a la derecha. Si no aparece, cierra la app Silvergear Fit.'],
  ['📷', 'Pesa y escanea', 'En <b>Pesar</b>: pon el plato, pulsa <b>Tara</b>, escanea el producto o búscalo y verás sus calorías en vivo según lo que pesa.'],
  ['🍲', 'Recetas a tu medida', 'Cada receta ajusta los gramos a <b>tus</b> calorías. Con <b>Cocinar con la báscula</b> te guía ingrediente a ingrediente.'],
  ['🛒', 'Menú y compra', 'Autorellena el menú de la semana y la app te hace la lista de la compra, en el súper más barato y compartida en tiempo real con tu pareja.'],
  ['☁️', 'No pierdas nada', 'Configura la <b>copia en GitHub</b> en Ajustes: guarda todo solo y lo recuperas si reinstaláis.'],
  ['🎯', 'Primer paso', 'Calcula tu objetivo de calorías: tarda 30 segundos y todo lo demás se ajusta a él. Cuando tengas dudas, pulsa <b>?</b> arriba en cualquier pantalla.']
];
function startTour(i = 0) {
  const [ic, t, b] = TOUR[i], last = i === TOUR.length - 1;
  openSheet(`<div style="text-align:center;padding:10px 4px 0"><div style="font-size:64px;line-height:1.2">${ic}</div><h2 style="margin:10px 0 8px;font-size:24px;letter-spacing:-.02em">${t}</h2><p style="line-height:1.55;color:var(--mute);margin:0 0 18px">${b}</p>
  <div style="display:flex;gap:6px;justify-content:center;margin-bottom:18px">${TOUR.map((_, j) => `<span style="width:${j === i ? 20 : 7}px;height:7px;border-radius:4px;background:${j === i ? 'var(--acc)' : 'var(--line)'};transition:width .2s"></span>`).join('')}</div>
  ${last ? `<button class="btn pri block" onclick="S.onboarded=1;S.seenVersion=APP_VERSION;save();openCalc()">🧮 Calcular mi objetivo</button><button class="btn ghost block" style="margin-top:6px" onclick="S.onboarded=1;S.seenVersion=APP_VERSION;save();closeSheet();render()">Empezar sin calcular</button>`
    : `<div class="row">${i ? `<button class="btn sp" onclick="startTour(${i - 1})">‹ Atrás</button>` : `<button class="btn sp" onclick="S.onboarded=1;S.seenVersion=APP_VERSION;save();closeSheet();render()">Saltar</button>`}<button class="btn pri sp" onclick="startTour(${i + 1})">Siguiente ›</button></div>`}</div>`);
}

/* ---------- inicio ---------- */
render();
pullPrices();
if (SY.pending && syncReady()) setTimeout(() => syncPush(true), 3000);
if (!S.onboarded) { if (Object.keys(S.diary).length || S.body) { S.onboarded = 1; save(true); } else startTour(); }
</script>
</body>
</html>
